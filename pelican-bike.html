    figure { margin: 0; }
    .stage { display: block; width: 100%; aspect-ratio: 1140 / 600; background: #acd7cd; border: 1px solid #173d3e; border-radius: 3px; }

    button { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid #567373; border-radius: 99px; background: transparent; color: inherit; font: 650 .82rem system-ui, sans-serif; cursor: pointer; }
    button[hidden] { display: none; }
    button:hover { background: #e5e9d9; }
    button:active { background: #d5decb; }
    button:focus-visible { outline: 2px solid #a34332; outline-offset: 3px; }
    button svg { width: 15px; height: 15px; fill: currentColor; }
    button[data-playing="true"] .play, button[data-playing="false"] .pause { display: none; }
    @media (max-width: 620px) {
      .stage { aspect-ratio: 4 / 3; }
      .edition { display: none; }
      .caption { letter-spacing: .07em; }
    }
    @media (max-height: 850px) and (min-width: 850px) {
      main { width: min(100%, 1150px, calc((100svh - 184px) * 1.9)); }

  <script>
    (() => {
      const byId = id => document.getElementById(id);
      const toggle = byId('toggle');
      const label = byId('toggle-label');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const moving = Object.fromEntries([
        'clouds', 'gulls', 'water', 'rail', 'road', 'wind', 'foreground', 'bike', 'rider', 'eye',
        'bike-shadow', 'rear-spokes', 'front-spokes', 'scarf-tail', 'scarf-stripe',
        'far-leg', 'far-crank', 'far-foot', 'near-leg', 'near-leg-light', 'near-crank', 'near-foot'
      ].map(id => [id, byId(id)]));
      const tau = 2 * Math.PI;
      const center = { x: 519, y: 472 };
      const radius = 22;
      const speed = 450;
      const set = (id, attr, value) => moving[id].setAttribute(attr, value);
      const shift = (id, x, y = 0) => set(id, 'transform', `translate(${x} ${y})`);

      function pedal(side, angle, hipX, hipY) {
        const x = center.x + radius * Math.cos(angle);
        const y = center.y + radius * Math.sin(angle);
        const ankleX = x - 6;
        const ankleY = y - 6;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        // The knee is the forward intersection of two circles around hip and ankle.
        // Both segments have the same length, so the intersection is over the midpoint.
        const bend = Math.sqrt(Math.max(0, 86 ** 2 - (distance / 2) ** 2)) / distance;
        const kneeX = (hipX + ankleX) / 2 + dy * bend;
        const kneeY = (hipY + ankleY) / 2 - dx * bend;
        const leg = `M${hipX} ${hipY}Q${kneeX} ${kneeY - 10} ${kneeX} ${kneeY}T${ankleX} ${ankleY}`;
        set(`${side}-leg`, 'd', leg);
        if (side === 'near') set('near-leg-light', 'd', leg);
        set(`${side}-crank`, 'd', `M${center.x} ${center.y}L${x} ${y}`);
        shift(`${side}-foot`, x, y);
      }

      function draw(t) {
        const phase = t * tau / 1.64 - .65;
        const bob = Math.sin(2 * phase) * 2.1;
        const wheelAngle = (t * speed / 90 * 180 / Math.PI) % 360;
        const flutter = Math.sin(t * 10.8) * 8 + Math.sin(t * 6.4) * 4;
        const gust = Math.sin(t * 10.8 - 1.35) * 12 + Math.sin(t * 5.6) * 5;
        const anchor = 239 + bob;

        shift('clouds', Math.sin(t * .23) * 23);
        shift('gulls', Math.sin(t * .39) * 39, Math.sin(t * 1.16) * 6);
        shift('water', -(t * 14 % 380));
        shift('rail', -(t * 175 % 180));
        shift('road', -(t * speed % 240));
        shift('foreground', -(t * 515 % 1140));
        shift('wind', Math.sin(t * 2.8) * 13, Math.sin(t * 1.6) * 4);
        set('wind', 'opacity', .61 + Math.sin(t * 2.8 + .3) * .24);
        set('bike-shadow', 'rx', 322 + Math.sin(phase * 2) * 3);
        shift('bike', Math.sin(t * 1.3) * 6, Math.sin(t * 7.1) * .5);
        shift('rider', 0, bob);
        set('rear-spokes', 'transform', `rotate(${wheelAngle})`);
        set('front-spokes', 'transform', `rotate(${wheelAngle + 35})`);
        set('scarf-tail', 'd', `M582 ${anchor}C524 ${216 + flutter} 459 ${196 + gust} 384 ${226 + gust}l21 10-14 17C461 ${225 + gust} 517 ${245 + flutter} 572 ${anchor + 24}Z`);
        set('scarf-stripe', 'd', `M407 ${233 + gust}C470 ${213 + gust} 524 ${225 + flutter} 574 ${anchor + 11}`);
        const blink = Math.max(0, 1 - Math.abs(t % 4.7 - 3.35) / .095);
        set('eye', 'transform', `translate(0 ${171 * blink * .9}) scale(1 ${1 - blink * .9})`);
        pedal('far', phase + Math.PI, 486, 337 + bob);
        pedal('near', phase, 478, 338 + bob);
      }

      let playing = false;
      let elapsed = 0;
      let previous;
      let frame;

      function tick(now) {
        if (previous !== undefined) elapsed += (now - previous) / 1000;
        previous = now;
        draw(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function setPlaying(value) {
        cancelAnimationFrame(frame);
        previous = undefined;
        playing = value;
        toggle.dataset.playing = String(playing);
        label.textContent = playing ? '暂停动画' : '播放动画';
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => setPlaying(!playing));
      reducedMotion.addEventListener('change', event => setPlaying(!event.matches));
      document.addEventListener('visibilitychange', () => setPlaying(playing));
      draw(0);
      setPlaying(!reducedMotion.matches);
      toggle.hidden = false;
    })();
  </script>
</body>
</html>
